<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#B9A6FF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="description" content="Ghost Alarm: alarms, habits, sleep journal and a voice coach that gets you up."/>
<title>Ghost Alarm — Rise. Grow. Glow.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👻%3C/text%3E%3C/svg%3E"/>
<style>
:root{
  --violet:#7357D9;--violet-deep:#4C34A0;--violet-soft:#B9A6FF;--violet-pale:#EDE7FF;--lavender-soft:#F3EEFF;
  --lavender:#F8F5FF;--paper:#FFFFFF;--ink:#241F38;--muted:#7A7289;--line:#E6DFF6;
  --success:#2F8A6C;--danger:#B8455F;--amber:#A2681A;
  --shadow:0 12px 34px rgba(76,52,160,.09);--shadow-sm:0 6px 18px rgba(76,52,160,.06);
  --radius:26px;--safe-bottom:max(env(safe-area-inset-bottom),18px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#DED5F6}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--lavender);color:var(--ink);min-height:100dvh;max-width:560px;margin:0 auto;padding:0 18px 122px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .16s ease,opacity .16s ease}
button:active{transform:scale(.975)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid rgba(115,87,217,.3);outline-offset:2px}
h1,h2,h3{line-height:1.15}
.view{display:none}
.view.active{display:block;animation:appear .26s ease}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.app-header{padding-top:max(env(safe-area-inset-top),26px);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:45px;height:45px;border-radius:16px;background:linear-gradient(150deg,var(--violet-soft),var(--violet));display:grid;place-items:center;font-size:24px;box-shadow:0 8px 20px rgba(115,87,217,.26);flex-shrink:0}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.4px}
.brand-tag{font-size:10px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;font-weight:750}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--violet-deep);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.eyebrow{font-size:10.5px;letter-spacing:1.7px;text-transform:uppercase;color:var(--violet);font-weight:800}
.page-title{font-size:31px;letter-spacing:-1.1px;font-weight:800;margin-top:5px}
.page-subtitle{font-size:13px;color:var(--muted);margin-top:6px}
.section-header{padding-top:max(env(safe-area-inset-top),26px);margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.section-actions{display:flex;gap:8px;flex-shrink:0}
.add-btn{border:0;background:linear-gradient(150deg,var(--violet-soft),var(--violet));color:#fff;width:44px;height:44px;border-radius:15px;font-size:24px;line-height:1;box-shadow:0 8px 18px rgba(115,87,217,.26)}
.hero{position:relative;overflow:hidden;border-radius:32px;padding:24px 22px;background:linear-gradient(150deg,#AE97F7 0%,#8265DE 58%,#5E42B8 100%);color:#fff;box-shadow:0 18px 38px rgba(94,66,184,.26)}
.hero:after{content:"👻";position:absolute;right:-6px;bottom:-26px;font-size:120px;opacity:.14;transform:rotate(-9deg);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.hero-date{font-size:11.5px;font-weight:700;opacity:.82;letter-spacing:.3px}
.hero-badge{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:rgba(255,255,255,.16);padding:5px 9px;border-radius:20px}
.hero-time{font-size:62px;line-height:1.02;letter-spacing:-3.4px;font-weight:750;margin-top:12px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hero-time small{font-size:17px;letter-spacing:0;font-weight:650;margin-left:6px;opacity:.78}
.hero-next{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:12px;position:relative;z-index:1;opacity:.95}
.live-dot{width:8px;height:8px;border-radius:50%;background:#DCFFD9;box-shadow:0 0 0 5px rgba(220,255,217,.14);flex-shrink:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:15px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.text-btn{border:0;background:transparent;color:var(--violet);font-size:12.5px;font-weight:750;padding:4px}
.muted{color:var(--muted)}
.challenge-card{display:flex;gap:13px;align-items:flex-start;background:linear-gradient(140deg,#EFE8FF,#FFFFFF 70%)}
.feature-icon{width:44px;height:44px;border-radius:15px;background:var(--violet-pale);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.challenge-text{font-size:14.5px;font-weight:650;margin:5px 0 11px;line-height:1.5}
.check-btn{border:0;border-radius:12px;background:var(--violet);color:#fff;padding:9px 14px;font-size:12px;font-weight:750}
.check-btn.done{background:#DDF3E9;color:var(--success)}
.coach-teaser{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.coach-teaser .ghost{font-size:32px;flex-shrink:0}
.coach-teaser .quote{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.coach-teaser .quote strong{color:var(--ink);font-size:14px}
.coach-teaser .arrow{color:var(--violet);font-size:20px;flex-shrink:0}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mini-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;text-align:left;box-shadow:var(--shadow-sm)}
.mini-card .big{font-size:22px;font-weight:800;letter-spacing:-.7px;margin-top:9px}
.mini-card .small{font-size:11.5px;color:var(--muted);margin-top:2px}
.alarm-card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.alarm-card.off{opacity:.6}
.alarm-top{display:flex;align-items:center;gap:11px}
.alarm-symbol{width:42px;height:42px;border-radius:14px;background:var(--violet-pale);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.alarm-label{font-size:14px;font-weight:750;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.priority-tag{font-size:9px;font-weight:800;letter-spacing:.7px;color:var(--amber);background:#FDF1DC;border-radius:7px;padding:3px 6px;flex-shrink:0}
.alarm-main{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.alarm-time{font-size:36px;font-weight:750;letter-spacing:-1.6px;line-height:1}
.alarm-time small{font-size:13px;letter-spacing:0;color:var(--muted);font-weight:650;margin-left:2px}
.alarm-meta{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:right}
.alarm-meta .missed{color:var(--danger);font-weight:750}
.alarm-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.alarm-actions button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:650;padding:4px 2px}
.alarm-actions .delete{color:var(--danger)}
.switch{position:relative;width:48px;height:28px;flex-shrink:0;display:inline-block}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch-track{position:absolute;inset:0;border-radius:20px;background:#DCD5E8;transition:background .2s;pointer-events:none}
.switch-track:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 2px 5px rgba(0,0,0,.16);transition:transform .2s}
.switch input:checked+.switch-track{background:var(--violet)}
.switch input:checked+.switch-track:after{transform:translateX(20px)}
.empty-state{text-align:center;padding:44px 24px;background:var(--paper);border:1px dashed #CFC2EA;border-radius:26px;color:var(--muted)}
.empty-state .empty-icon{font-size:44px;display:block;margin-bottom:10px}
.empty-state strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty-state p{font-size:12.5px}
</style>
<style>
.progress-ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--violet) var(--progress,0%),var(--violet-pale) 0);position:relative;flex-shrink:0}
.progress-ring:before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
.progress-ring div{position:relative;text-align:center}
.progress-ring strong{display:block;font-size:24px;letter-spacing:-1px}
.progress-ring span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.habit-overview{display:flex;align-items:center;justify-content:space-between;gap:18px}
.habit-stats{flex:1;min-width:0}
.habit-stat{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.habit-stat:last-child{border:0}
.habit-stat strong{font-size:14px;color:var(--ink)}
.habit-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.habit-row:last-child{border:0;padding-bottom:0}
.habit-check{width:34px;height:34px;border-radius:12px;border:2px solid #D6CBEA;background:#fff;color:#fff;font-size:16px;display:grid;place-items:center;flex-shrink:0}
.habit-check.done{background:var(--violet);border-color:var(--violet)}
.habit-info{flex:1;min-width:0}
.habit-name{font-size:14.5px;font-weight:750}
.habit-goal{font-size:11.5px;color:var(--muted);margin-top:2px}
.habit-streak{font-size:11px;color:var(--violet-deep);font-weight:750;text-align:right;flex-shrink:0}
.habit-streak small{display:block;font-size:9px;color:var(--muted);font-weight:600}
.habit-delete{border:0;background:transparent;color:#C0B6D2;font-size:17px;padding:2px 4px;flex-shrink:0}
.sleep-score{display:flex;align-items:center;gap:18px}
.sleep-score-number{font-size:44px;line-height:1;font-weight:800;color:var(--violet-deep);letter-spacing:-2px}
.sleep-score-number small{font-size:14px;letter-spacing:0;color:var(--muted)}
.sleep-quality{font-size:16px;font-weight:750}
.sleep-note{font-size:11.5px;color:var(--muted);margin-top:3px}
.stage-bar{height:15px;border-radius:10px;overflow:hidden;display:flex;margin:20px 0 10px}
.stage-awake{background:#DCD0FA}.stage-light{background:#A48BEA}.stage-deep{background:#5C41AE}
.stage-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);gap:6px}
.stage-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.disclaimer{font-size:11px;color:var(--muted);line-height:1.55;background:#F1EBFB;border-radius:15px;padding:12px;margin-top:14px}
.sleep-log{padding:12px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:11px}
.sleep-log:first-child{border-top:0;padding-top:0}
.sleep-log-icon{font-size:20px}
.sleep-log-info{flex:1;min-width:0}
.sleep-log-info strong{font-size:13.5px;display:block}
.sleep-log-info span{font-size:11px;color:var(--muted)}
.sound-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.sound-card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:0;overflow:hidden;text-align:left;box-shadow:var(--shadow-sm)}
.sound-art{height:80px;display:grid;place-items:center;font-size:34px;position:relative}
.sound-card.playing{border:2px solid var(--violet)}
.sound-bars{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;height:14px}
.sound-bars i{width:3px;background:rgba(255,255,255,.9);border-radius:2px;animation:bar .9s ease-in-out infinite}
.sound-bars i:nth-child(1){height:8px;animation-delay:0s}
.sound-bars i:nth-child(2){height:14px;animation-delay:.2s}
.sound-bars i:nth-child(3){height:6px;animation-delay:.4s}
@keyframes bar{50%{transform:scaleY(.4)}}
.sound-info{padding:10px 11px 11px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.sound-name{font-size:12.5px;font-weight:750}
.sound-play{font-size:12px;color:var(--violet)}
.coach-hero{border-radius:28px;padding:22px;background:linear-gradient(150deg,#7E64D8,#4A2F9A);color:#fff;position:relative;overflow:hidden}
.coach-hero:after{content:"👻";position:absolute;right:-10px;top:-14px;font-size:104px;opacity:.13;pointer-events:none}
.coach-hero .ghost{font-size:48px;filter:drop-shadow(0 7px 10px rgba(0,0,0,.16))}
.coach-hero h2{font-size:21px;margin-top:8px;letter-spacing:-.6px}
.coach-hero p{font-size:12.5px;opacity:.8;margin-top:4px;max-width:88%}
.voice-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:7px 11px;border-radius:20px;font-size:10.5px;margin-top:12px;border:0;color:#fff;font-weight:650}
.chat-wrap{display:flex;flex-direction:column;margin-top:14px}
.chat-messages{max-height:46dvh;min-height:170px;overflow-y:auto;padding:4px 2px 8px;scroll-behavior:smooth}
.chat-bubble{max-width:88%;padding:12px 14px;border-radius:19px;margin-bottom:10px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.chat-bubble.ghost{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;margin-right:auto}
.chat-bubble.user{background:var(--violet);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.chat-bubble .ts{font-size:9px;opacity:.55;margin-top:5px;text-align:right}
.quick-replies{display:flex;gap:7px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.quick-replies::-webkit-scrollbar{display:none}
.quick-replies button{border:1px solid #D9CEF2;background:#fff;color:var(--violet-deep);border-radius:16px;padding:8px 12px;font-size:11px;font-weight:650;white-space:nowrap}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:17px;background:#fff;padding:13px 15px;font-size:14px}
.send-btn{border:0;border-radius:16px;background:var(--violet);color:#fff;width:48px;font-size:17px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(36,31,56,.46);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--lavender);border-radius:30px 30px 0 0;padding:20px 18px var(--safe-bottom);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;box-shadow:0 -15px 45px rgba(36,31,56,.2);animation:rise .24s ease}
@keyframes rise{from{transform:translateY(28px)}to{transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.sheet-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.close-btn{border:0;background:#E8E0F5;color:var(--violet-deep);width:34px;height:34px;border-radius:12px;font-size:17px;flex-shrink:0}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:750;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 13px;min-height:47px;font-size:14px}
.field textarea{resize:vertical;min-height:74px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.choice-row{display:flex;gap:7px;flex-wrap:wrap}
.choice{flex:1;min-width:60px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--muted);padding:10px 5px;font-size:11px;font-weight:700}
.choice.selected{background:var(--violet);border-color:var(--violet);color:#fff}
.emoji-choices .choice{font-size:22px;min-width:46px;padding:8px 4px}
.primary-btn{width:100%;border:0;border-radius:17px;background:linear-gradient(150deg,var(--violet-soft),var(--violet));color:#fff;padding:15px;font-weight:800;font-size:14.5px;box-shadow:0 8px 18px rgba(115,87,217,.22)}
.secondary-btn{width:100%;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--violet-deep);padding:13px;font-weight:750;font-size:13.5px;margin-top:9px}
.danger-btn{color:var(--danger)}
.settings-group{background:#fff;border:1px solid var(--line);border-radius:22px;padding:2px 15px;margin-bottom:15px}
.setting-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border:0}
.setting-info{flex:1;min-width:0}
.setting-title{font-size:13.5px;font-weight:700}
.setting-desc{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.setting-row select,.setting-row input[type=number]{max-width:118px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;font-size:12.5px}
.setting-row input[type=number]{max-width:70px}
.settings-pad{padding:2px 0 14px}
.privacy-note{text-align:center;color:var(--muted);font-size:10.5px;line-height:1.6;padding:4px 16px 16px}
.knowledge-item{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.knowledge-item:last-child{border:0}
.k-icon{width:34px;height:34px;border-radius:11px;background:var(--violet-pale);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.knowledge-item strong{display:block;font-size:13px;margin-bottom:2px}
.knowledge-item p{font-size:11.5px;color:var(--muted);line-height:1.5}
.ringer{background:linear-gradient(160deg,#A78CEE,#5B3FAF);color:#fff;border-radius:28px;padding:30px 20px 24px;text-align:center;overflow:hidden}
.ringer-ghost{font-size:78px;animation:float 2.2s ease-in-out infinite;display:block}
@keyframes float{50%{transform:translateY(-9px) rotate(3deg)}}
.ringer-label{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;opacity:.78;margin-top:14px}
.ringer-title{font-size:26px;font-weight:800;margin:6px 0 12px;letter-spacing:-.6px}
.ringer-message{font-size:14px;line-height:1.6;opacity:.92;margin-bottom:14px}
.ringer-challenge{background:rgba(255,255,255,.15);padding:13px;border-radius:16px;font-size:12.5px;margin-bottom:16px;text-align:left}
.ringer-actions{display:flex;gap:10px}
.ringer-actions button{flex:1;border:0;border-radius:17px;padding:14px;font-weight:750;font-size:13.5px}
.ringer-dismiss{background:#fff;color:var(--violet-deep)}
.ringer-snooze{background:rgba(255,255,255,.2);color:#fff}
.ringer-speak{border:0;background:transparent;color:#fff;font-size:11.5px;margin-bottom:13px;text-decoration:underline;opacity:.9}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);background:var(--ink);color:#fff;border-radius:15px;padding:11px 16px;font-size:12px;z-index:200;opacity:0;pointer-events:none;transition:.24s;max-width:88%;text-align:center;box-shadow:0 10px 26px rgba(36,31,56,.28)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:561px){body{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
