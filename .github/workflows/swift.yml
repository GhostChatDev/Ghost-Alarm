name: Web app regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check mobile navigation, tools, persistence and weather
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/ghost-http.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch();
            try {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce' });
              const page = await context.newPage();
              page.setDefaultTimeout(8000);
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.addInitScript(() => {
                Object.defineProperty(navigator, 'geolocation', { configurable: true, value: {
                  getCurrentPosition(success, failure) {
                    if (window.denyLocation) failure({ code: 1 });
                    else success({ coords: { latitude: 14.5995, longitude: 120.9842 } });
                  }
                }});
              });
              let weatherMode = 'success', requests = 0;
              await page.route('https://api.open-meteo.com/**', route => {
                requests++;
                if (weatherMode === 'failure') return route.fulfill({ status: 503, body: '{}' });
                return route.fulfill({ json: { current: { temperature_2m: 27.6, weather_code: 2 }, daily: { precipitation_probability_max: [10, 35] } } });
              });
              await page.goto('http://127.0.0.1:8000', { waitUntil: 'networkidle' });
              assert.equal(await page.locator('meta[name="viewport"]').count(), 1);
              assert.equal(requests, 0, 'Weather must wait for user consent');
              const visible = async selector => assert(await page.locator(selector).isVisible(), selector + ' should be visible');
              const fits = async () => assert(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), 'Mobile page must not overflow sideways');
              const nav = async name => {
                await page.locator(`.tabbar [data-nav="${name}"]`).click();
                await visible('#view-' + name);
                assert(await page.locator(`.tabbar [data-nav="${name}"]`).evaluate(node => node.classList.contains('on')), 'Active navigation must be highlighted');
              };
              await visible('#view-home');
              assert.equal(await page.locator('.hero-ghost .ghost-art').count(), 1, 'Home uses the custom reference ghost');
              assert.equal(await page.locator('.feature-grid [data-go="coach"]').count(), 0, 'Coach is not duplicated in More Features');
              assert.equal(await page.locator('.feature-grid button').count(), 4, 'All useful feature tiles remain');
              await fits();
              await page.locator('#weatherRefresh').click();
              await page.waitForFunction(() => document.getElementById('weatherTemp').textContent === '28°C');
              assert.match(await page.locator('#weatherSummary').innerText(), /35%/);
              weatherMode = 'failure';
              await page.locator('#weatherRefresh').click();
              await page.waitForFunction(() => document.getElementById('weatherSummary').textContent.includes('could not load'));
              assert.equal(await page.locator('#weatherRefresh').isDisabled(), false);
              await page.evaluate(() => window.denyLocation = true);
              await page.locator('#weatherRefresh').click();
              assert.match(await page.locator('#weatherSummary').innerText(), /Location not available/);
              await nav('more');
              await visible('#challengeCard');
              for (const tool of ['alarms', 'habits', 'sleep']) {
                await page.locator(`.feature-grid [data-go="${tool}"]`).click();
                await visible('#view-' + tool);
                await fits();
                await nav('more');
              }
              await page.reload({ waitUntil: 'networkidle' });
              await visible('#view-more');
              await nav('home');
              await page.locator('#view-home [data-open="alarm"]').click();
              await visible('#paneAlarm');
              await page.locator('[data-daypart="pm"]').click();
              assert(await page.locator('[data-daypart="pm"]').evaluate(node => node.classList.contains('on')), 'AM/PM picker must select PM');
              await page.locator('#aHour').fill('23');
              await page.locator('#aMin').fill('59');
              await page.locator('#aLabel').fill('Browser regression alarm');
              await page.locator('#alarmForm').evaluate(form => form.requestSubmit());
              await nav('more');
              await page.locator('.feature-grid [data-go="alarms"]').click();
              assert.match(await page.locator('#alarmList').innerText(), /Browser regression alarm/);
              await page.locator('#alarmList [data-test]').click();
              await visible('#ringer.on');
              assert.equal(await page.locator('#ringer .ghost-art').count(), 1, 'Ringer uses the custom ghost');
              await page.locator('#ringerDone').click();
              await nav('coach');
              await visible('#chatInput');
              await page.locator('#ghostSettings').click();
              await visible('#paneSettings');
              await fits();
              await page.locator('#paneSettings [data-close]').click();
              await nav('home');
              for (const width of [320, 390, 768]) {
                await page.setViewportSize({ width, height: 844 });
                await fits();
              }
              assert.deepEqual(errors, [], 'No uncaught browser errors');
              console.log('ALL TESTS PASSED');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error('FAIL:', error); process.exit(1); });
          JS
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Run Swift logic unit tests
        run: |
          cat AppStore.swift - <<'SWIFT' > /tmp/run_tests.swift
          @main
          struct TestRunner {
              static func main() {
                  let failures = AppStore.runSelfTests()
                  if !failures.isEmpty {
                      fputs("FAIL: \(failures)\n", stderr)
                      exit(1)
                  }
                  print("ALL SWIFT LOGIC TESTS PASSED")
              }
          }
          SWIFT
          swiftc -parse-as-library /tmp/run_tests.swift -o /tmp/run_tests
          /tmp/run_tests
      - name: Generate Xcode project (XcodeGen) and build for iOS Simulator
        run: |
          set -euo pipefail
          if [ ! -f project.yml ]; then
            cat <<'YAML' > project.yml
          name: ReadyByEight
          options:
            bundleIdPrefix: com.ghostchat
            deploymentTarget:
              iOS: "17.0"
          targets:
            ReadyByEight:
              type: application
              platform: iOS
              sources:
                - path: AppStore.swift
                - path: GhostTheme.swift
                - path: ReadyByEight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ghostchat.readybyeight
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  SWIFT_VERSION: "5.10"
                  CODE_SIGNING_ALLOWED: NO
          schemes:
            ReadyByEight:
              build:
                targets:
                  ReadyByEight: all
          YAML
          fi
          brew install xcodegen
          xcodegen generate
          xcodebuild -project ReadyByEight.xcodeproj -scheme ReadyByEight \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log

